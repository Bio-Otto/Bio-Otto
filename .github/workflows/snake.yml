name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2E7D32&color_dots=#ebedf0,#a5d6a7,#66bb6a,#2e7d32,#1b5e20
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#69F0AE&color_dots=#161b22,#1b5e20,#2e7d32,#43a047,#69f0ae

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
